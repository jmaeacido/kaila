  <script id="slide-data" type="application/json">[{&quot;type&quot;:&quot;cover&quot;,&quot;section&quot;:&quot;Startup Guide&quot;,&quot;title&quot;:&quot;KAILA Right-Path Startup Guide&quot;,&quot;subtitle&quot;:&quot;A practical guide for starting the first KAILA pilot the right way.&quot;,&quot;body&quot;:[&quot;Validation first. Provider supply first. Trust first. Software second.&quot;,&quot;Based on the KAILA Founder-Grade Package.&quot;]},{&quot;section&quot;:&quot;The Main Rule&quot;,&quot;title&quot;:&quot;KAILA starts as a validation project before it becomes a software project.&quot;,&quot;body&quot;:[&quot;The browser MVP, native wrapper, and in-app forms already exist.&quot;,&quot;Now build proof: real users, real providers, requests, offers, completed or strongly matched jobs, ratings, and manageable disputes.&quot;,&quot;Use the app as the system of record and the Facebook page as the concierge posting channel.&quot;]},{&quot;section&quot;:&quot;Roadmap&quot;,&quot;title&quot;:&quot;90-Day Starting Roadmap&quot;,&quot;body&quot;:[&quot;Days 1-7: Foundation.&quot;,&quot;Days 8-21: Recruit providers.&quot;,&quot;Days 22-30: Validate clients.&quot;,&quot;Days 31-75: Concierge pilot.&quot;,&quot;Days 76-90: Review decision.&quot;,&quot;Output: forms, sheets, provider rules, provider list, real requests, tracked offers, ratings, and go/no-go decision.&quot;]},{&quot;section&quot;:&quot;Phase 0&quot;,&quot;title&quot;:&quot;Founder Alignment&quot;,&quot;body&quot;:[&quot;Agree on the operating philosophy before asking anyone to join.&quot;,&quot;KAILA is not just an app. It is a local trust and service-matching system.&quot;,&quot;Local first: start in one focused place, not everywhere.&quot;,&quot;Provider first: build supply before client demand.&quot;,&quot;Trust first: use trust levels instead of pretending all providers are equal.&quot;,&quot;Manual first: prove the workflow manually before building the product.&quot;,&quot;Free first: learn fast before charging.&quot;]},{&quot;section&quot;:&quot;Phase 1&quot;,&quot;title&quot;:&quot;Define the First Pilot&quot;,&quot;body&quot;:[&quot;Keep the first version narrow enough to operate and measure.&quot;,&quot;Area: Gingoog City or selected barangay cluster.&quot;,&quot;Clients: households, renters, homeowners, students, and small businesses.&quot;,&quot;Providers: skilled workers, technicians, freelancers, and shops.&quot;,&quot;Duration: 30-45 days of active matching.&quot;,&quot;Pricing: free pilot for clients and providers.&quot;,&quot;Goal: learn fast without creating a heavy operation.&quot;]},{&quot;section&quot;:&quot;Categories&quot;,&quot;title&quot;:&quot;Choose Focused Starting Categories&quot;,&quot;body&quot;:[&quot;Select practical, common, and manageable local services.&quot;,&quot;Appliance repair: urgent household need.&quot;,&quot;Plumbing: leaks and clogs.&quot;,&quot;Electrical: common but safety-sensitive.&quot;,&quot;Computer repair: students, offices, and homes.&quot;,&quot;Cellphone repair: common screen, battery, charging, and software issues.&quot;,&quot;Motorcycle repair: local mobility need.&quot;,&quot;Carpentry or maintenance: small repairs.&quot;,&quot;Cleaning or odd jobs: flexible supply.&quot;,&quot;Digital services: layouts, designs, and basic tech.&quot;,&quot;Avoid high-risk or hard-to-control services at the start.&quot;]},{&quot;section&quot;:&quot;Phase 2&quot;,&quot;title&quot;:&quot;Run the App-Led Concierge System&quot;,&quot;body&quot;:[&quot;Use the existing browser MVP and native wrapper as the operating base.&quot;,&quot;Facebook Page: public concierge posting and trust-building content.&quot;,&quot;In-app provider interview form: supply intake.&quot;,&quot;In-app client survey/request forms: demand intake.&quot;,&quot;Admin dashboard and request tracker: job evidence.&quot;,&quot;Messenger: follow-up and manual matching support.&quot;,&quot;This is the concierge pilot: the app captures data while the Facebook page creates local demand.&quot;]},{&quot;section&quot;:&quot;Phase 3&quot;,&quot;title&quot;:&quot;Recruit Providers First&quot;,&quot;body&quot;:[&quot;Clients will only trust KAILA if relevant providers are already available.&quot;,&quot;Target: 50 providers across the starting categories, including cellphone repair.&quot;,&quot;Aim for 3-5 providers per request.&quot;,&quot;Recruitment channels: personal networks, Facebook groups, repair shops, cellphone repair stalls, hardware stores, motorcycle shops, community referrals, and provider-to-provider referrals.&quot;,&quot;Provider pitch must answer: Will this help me get clients? Is it free? Can I accept or decline? Can I control my price?&quot;]},{&quot;section&quot;:&quot;Phase 4&quot;,&quot;title&quot;:&quot;Make Trust Visible&quot;,&quot;body&quot;:[&quot;Do not present all providers as equally verified.&quot;,&quot;Level 1: Listed.&quot;,&quot;Level 2: Identity Verified.&quot;,&quot;Level 3: Work Verified.&quot;,&quot;Level 4: Top Rated.&quot;,&quot;Level 5: Certified or Business Verified.&quot;,&quot;Trust grows through identity checks, work samples, completed pilot jobs, ratings, response speed, and low dispute rate.&quot;]},{&quot;section&quot;:&quot;Phase 5&quot;,&quot;title&quot;:&quot;Validate Client Demand&quot;,&quot;body&quot;:[&quot;Listen for repeated pain points before launching publicly.&quot;,&quot;Lisod mangita ug kasaligan: trust problem.&quot;,&quot;Walay klaro nga presyo: pricing problem.&quot;,&quot;Dugay mu-reply: response problem.&quot;,&quot;Referral ra gyud mi magsalig: informal discovery.&quot;,&quot;Wala ko kabalo kinsa duol: location discovery.&quot;,&quot;Target: 100 resident responses, or at least 30-50 strong responses before starting the first requests.&quot;]},{&quot;section&quot;:&quot;Phase 6&quot;,&quot;title&quot;:&quot;Run the Concierge Pilot&quot;,&quot;body&quot;:[&quot;The first KAILA workflow should be manual, measurable, and repeatable.&quot;,&quot;Client request -&gt; KAILA checks details -&gt; forward to providers -&gt; offers received -&gt; client chooses -&gt; job and ratings.&quot;,&quot;Record every step: time received, providers contacted, response time, offers, selected provider, agreed amount, completion, ratings, and issues.&quot;]},{&quot;section&quot;:&quot;Script&quot;,&quot;title&quot;:&quot;Practical Matching Script&quot;,&quot;body&quot;:[&quot;Use a consistent request format so providers can respond quickly.&quot;,&quot;KAILA Request #001: Category: Plumbing. Area: Barangay 23, Gingoog City. Problem: clogged kitchen sink. Urgency: today. Budget: PHP 500-PHP 800.&quot;,&quot;Ask: Can you take this job? If yes, send your offer and available time.&quot;,&quot;Send to 3-5 matching providers.&quot;,&quot;Record who replies and how fast.&quot;,&quot;Let the client compare offers clearly.&quot;,&quot;Do not share unnecessary private details too early.&quot;]},{&quot;section&quot;:&quot;Phase 7&quot;,&quot;title&quot;:&quot;Track the Right Metrics&quot;,&quot;body&quot;:[&quot;The pilot must be judged by evidence, not excitement.&quot;,&quot;Active providers: supply strength.&quot;,&quot;Requests: demand.&quot;,&quot;Response rate: provider seriousness.&quot;,&quot;Offers per request: market activity.&quot;,&quot;Completed jobs: actual value.&quot;,&quot;Ratings: trust.&quot;,&quot;Disputes: risk.&quot;,&quot;GMV: peso value of completed jobs through KAILA.&quot;]},{&quot;section&quot;:&quot;Phase 8&quot;,&quot;title&quot;:&quot;Go / No-Go Decision&quot;,&quot;body&quot;:[&quot;After the pilot, choose the next move based on evidence.&quot;,&quot;Proceed to MVP: real requests, provider response, 15+ completed or strongly matched jobs, ratings accepted, and disputes manageable.&quot;,&quot;Narrow scope: only 1-2 categories work strongly, so focus on the winning categories instead of stopping.&quot;,&quot;Redesign or pause: providers refuse, clients avoid posting, trust barriers are too high, or operations cannot support matching.&quot;,&quot;Decision question: What does the data say?&quot;]},{&quot;section&quot;:&quot;Phase 9&quot;,&quot;title&quot;:&quot;Build MVP Only After Strong Signals&quot;,&quot;body&quot;:[&quot;The MVP should digitize the proven manual workflow.&quot;,&quot;Client: register, post request, compare offers, choose provider, confirm and rate.&quot;,&quot;Provider: create profile, view matching requests, send offer, update job, rate client.&quot;,&quot;Admin: manage users, verify providers, track jobs, handle disputes, view reports.&quot;]},{&quot;section&quot;:&quot;Scope&quot;,&quot;title&quot;:&quot;Do Not Build These Yet&quot;,&quot;body&quot;:[&quot;Avoid heavy features before the core marketplace behavior is proven.&quot;,&quot;Do not build in-app payments yet.&quot;,&quot;Do not build GPS live tracking yet.&quot;,&quot;Do not build native mobile apps yet.&quot;,&quot;Do not build complex AI matching yet.&quot;,&quot;Do not build large-scale automation yet.&quot;,&quot;First prove: request posting -&gt; provider offers -&gt; client selection -&gt; job completion -&gt; ratings -&gt; trust improvement.&quot;]},{&quot;section&quot;:&quot;Phase 10&quot;,&quot;title&quot;:&quot;Monetize Slowly&quot;,&quot;body&quot;:[&quot;Do not charge until providers feel real value.&quot;,&quot;Step 1: Free pilot to build trust.&quot;,&quot;Step 2: Visibility products such as premium profiles or featured listings.&quot;,&quot;Step 3: Lead or transaction revenue through lead credits, subscriptions, or commission.&quot;,&quot;Recommended first paid product: provider visibility, not commission.&quot;]},{&quot;section&quot;:&quot;Team&quot;,&quot;title&quot;:&quot;Founder Roles Must Be Clear&quot;,&quot;body&quot;:[&quot;Even if one person holds multiple roles, responsibilities should be named.&quot;,&quot;Product / Tech.&quot;,&quot;Provider Acquisition.&quot;,&quot;Operations.&quot;,&quot;Marketing / Community.&quot;,&quot;Finance / Admin.&quot;,&quot;Business Strategy.&quot;,&quot;KAILA Pilot Team.&quot;]},{&quot;section&quot;:&quot;Protection&quot;,&quot;title&quot;:&quot;Protect KAILA Early&quot;,&quot;body&quot;:[&quot;Treat data, brand, provider records, and internal strategy carefully.&quot;,&quot;Provider list: limit access.&quot;,&quot;Client requests: share only needed details.&quot;,&quot;Photos and videos: ask permission before posting.&quot;,&quot;Ratings and disputes: keep factual records.&quot;,&quot;Brand and documents: organize source files.&quot;,&quot;Code: clarify ownership.&quot;,&quot;Trust can be damaged by poor data handling before the app even exists.&quot;]},{&quot;section&quot;:&quot;Rhythm&quot;,&quot;title&quot;:&quot;Weekly Operating Rhythm&quot;,&quot;body&quot;:[&quot;Review evidence, improve the workflow, and assign next actions.&quot;,&quot;Track providers joined, active providers, client requests, top categories, response time, offers per request, completed jobs, ratings, disputes, and next actions.&quot;,&quot;Weekly output: metrics summary, top lessons, problems found, assigned next actions, and decision notes.&quot;]},{&quot;section&quot;:&quot;Checklist&quot;,&quot;title&quot;:&quot;First 7 Days: Exact Starter Checklist&quot;,&quot;body&quot;:[&quot;Start immediately with the existing MVP.&quot;,&quot;Day 1: Confirm pilot scope and categories.&quot;,&quot;Day 2: Create Facebook page for KAILA concierge posting.&quot;,&quot;Day 3: Test in-app provider interview and signup flow.&quot;,&quot;Day 4: Test in-app client survey/request flow.&quot;,&quot;Day 5: Publish rules, scripts, and support responses.&quot;,&quot;Day 6: Build 100 provider leads, including cellphone repair.&quot;,&quot;Day 7: Start outreach and posting.&quot;,&quot;Week 1 is successful if KAILA can collect signups, receive requests, and track everything inside the app.&quot;]},{&quot;type&quot;:&quot;closing&quot;,&quot;section&quot;:&quot;Recommended First Move&quot;,&quot;title&quot;:&quot;KAILA Gingoog Concierge Pilot&quot;,&quot;body&quot;:[&quot;50 providers across the revised category mix.&quot;,&quot;100 client responses through the app survey.&quot;,&quot;30 real requests through the app and Facebook concierge posts.&quot;,&quot;15 completed or strongly matched jobs.&quot;,&quot;Starting categories include cellphone repair.&quot;,&quot;30-45 active matching days.&quot;,&quot;If the pilot shows strong behavior and trust, improve the MVP around the proven workflow.&quot;]}]</script>
