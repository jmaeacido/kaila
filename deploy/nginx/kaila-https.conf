server {
    listen 80;
    listen [::]:80;
    server_name kaila-app.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _ kaila-app.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/kaila-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaila-app.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kaila;
    index index.html;

    client_max_body_size 32m;

    location ^~ /kaila-api/ {
        proxy_pass http://127.0.0.1:6002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
