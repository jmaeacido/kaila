import groovy.json.JsonOutput
import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def kailaRootDir = rootProject.projectDir.parentFile
def kailaSocketEnvFile = new File(kailaRootDir, "socket/.env")
def kailaSocketEnv = [:]
if (kailaSocketEnvFile.exists()) {
    kailaSocketEnvFile.eachLine { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith("#") || !trimmed.contains("=")) return
        def separator = trimmed.indexOf("=")
        def key = trimmed.substring(0, separator).trim()
        def value = trimmed.substring(separator + 1).trim()
        if ((value.startsWith("\"") && value.endsWith("\"")) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
        kailaSocketEnv[key] = value
    }
}
def kailaConfigValue = { String name, String socketEnvName = null, String fallback = "" ->
    def socketName = socketEnvName ?: name
    return findProperty(name) ?: System.getenv(name) ?: kailaSocketEnv[socketName] ?: fallback
}
def kailaMobileUpdateMetadataFile = new File(kailaRootDir, "socket/mobile-update.json")
def kailaExistingMobileUpdateMetadata = [:]
if (kailaMobileUpdateMetadataFile.exists()) {
    try {
        kailaExistingMobileUpdateMetadata = new JsonSlurper().parse(kailaMobileUpdateMetadataFile) as Map
    } catch (ignored) {
        kailaExistingMobileUpdateMetadata = [:]
    }
}
def kailaExplicitVersionCode = findProperty("KAILA_VERSION_CODE") ?: System.getenv("KAILA_VERSION_CODE")
def kailaExistingVersionCode = 0L
try {
    kailaExistingVersionCode = (kailaExistingMobileUpdateMetadata.latestVersionCode ?: 0) as Long
} catch (ignored) {
    kailaExistingVersionCode = 0L
}
def kailaAutoVersionCode = Math.max((System.currentTimeMillis() / 1000) as Long, kailaExistingVersionCode + 1L)
def kailaVersionCode = (kailaExplicitVersionCode ?: String.valueOf(kailaAutoVersionCode)) as Integer
if (kailaExplicitVersionCode && kailaVersionCode <= kailaExistingVersionCode) {
    throw new GradleException("KAILA_VERSION_CODE must be greater than existing latestVersionCode ${kailaExistingVersionCode}.")
}
def kailaVersionName = findProperty("KAILA_VERSION_NAME") ?: System.getenv("KAILA_VERSION_NAME") ?: "1.0.${kailaVersionCode}"
def kailaUpdateApkUrl = kailaConfigValue("KAILA_ANDROID_APK_URL", null, String.valueOf(kailaExistingMobileUpdateMetadata.apkUrl ?: ""))
def kailaUpdateReleaseNotes = kailaConfigValue("KAILA_ANDROID_RELEASE_NOTES", null, String.valueOf(kailaExistingMobileUpdateMetadata.releaseNotes ?: ""))
def prepareKailaWebAssets = tasks.register('prepareKailaWebAssets', Exec) {
    workingDir kailaRootDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'node', 'scripts\\prepare-capacitor-web.js'
    } else {
        commandLine 'node', 'scripts/prepare-capacitor-web.js'
    }
}
def writeKailaMobileUpdateMetadata = tasks.register('writeKailaMobileUpdateMetadata') {
    doLast {
        def metadata = [
            latestVersionCode: kailaVersionCode,
            latestVersionName: kailaVersionName,
            apkUrl: kailaUpdateApkUrl,
            releaseNotes: kailaUpdateReleaseNotes,
            generatedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
            source: kailaExplicitVersionCode ? "explicit" : "auto"
        ]
        kailaMobileUpdateMetadataFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + System.lineSeparator()
    }
}

tasks.named('preBuild') {
    dependsOn prepareKailaWebAssets
}

android {
    namespace = "com.kaila.marketplace"
    compileSdk = rootProject.ext.compileSdkVersion

    def kailaKeystorePath = kailaConfigValue("KAILA_RELEASE_STORE_FILE")
    def kailaKeystorePassword = kailaConfigValue("KAILA_RELEASE_STORE_PASSWORD")
    def kailaKeyAlias = kailaConfigValue("KAILA_RELEASE_KEY_ALIAS")
    def kailaKeyPassword = kailaConfigValue("KAILA_RELEASE_KEY_PASSWORD")

    signingConfigs {
        release {
            if (kailaKeystorePath && kailaKeystorePassword && kailaKeyAlias && kailaKeyPassword) {
                storeFile file(kailaKeystorePath)
                storePassword kailaKeystorePassword
                keyAlias kailaKeyAlias
                keyPassword kailaKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.kaila.marketplace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode kailaVersionCode
        versionName kailaVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (kailaKeystorePath && kailaKeystorePassword && kailaKeyAlias && kailaKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "kaila-mobile-v${variant.versionName}-${variant.versionCode}-${variant.name}.apk"
        }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        def variantName = variant.name
        def capitalizedVariantName = variantName.capitalize()
        def apkOutputDir = layout.buildDirectory.dir("outputs/apk/${variantName}")
        def apkAliasDir = layout.buildDirectory.dir("outputs/apk/kaila/${variantName}")
        def copyTaskName = "copy${capitalizedVariantName}Apk"

        tasks.register(copyTaskName, Copy) {
            from(apkOutputDir) {
                include "*.apk"
                exclude "kaila-mobile.apk"
                rename { "kaila-mobile.apk" }
            }
            into apkAliasDir
        }

        tasks.named("assemble${capitalizedVariantName}") {
            finalizedBy copyTaskName
            finalizedBy writeKailaMobileUpdateMetadata
        }

        def bundleTaskName = "bundle${capitalizedVariantName}"
        if (tasks.findByName(bundleTaskName) != null) {
            def bundleOutputDir = layout.buildDirectory.dir("outputs/bundle/${variantName}")
            def bundleAliasDir = layout.buildDirectory.dir("outputs/bundle/kaila/${variantName}")
            def copyBundleTaskName = "copy${capitalizedVariantName}Bundle"

            tasks.register(copyBundleTaskName, Copy) {
                from(bundleOutputDir) {
                    include "*.aab"
                    rename { "kaila-mobile-v${variant.versionName}-${variant.versionCode}-${variant.name}.aab" }
                }
                into bundleAliasDir
            }

            tasks.named(bundleTaskName) {
                finalizedBy copyBundleTaskName
                finalizedBy writeKailaMobileUpdateMetadata
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    def firebaseMessagingVersion = rootProject.ext.has('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
