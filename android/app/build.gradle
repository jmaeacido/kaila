apply plugin: 'com.android.application'

def kailaRootDir = rootProject.projectDir.parentFile
def prepareKailaWebAssets = tasks.register('prepareKailaWebAssets', Exec) {
    workingDir kailaRootDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'node', 'scripts\\prepare-capacitor-web.js'
    } else {
        commandLine 'node', 'scripts/prepare-capacitor-web.js'
    }
}

tasks.named('preBuild') {
    dependsOn prepareKailaWebAssets
}

android {
    namespace = "com.kaila.marketplace"
    compileSdk = rootProject.ext.compileSdkVersion

    def kailaVersionCode = (findProperty("KAILA_VERSION_CODE") ?: System.getenv("KAILA_VERSION_CODE") ?: "1") as Integer
    def kailaVersionName = findProperty("KAILA_VERSION_NAME") ?: System.getenv("KAILA_VERSION_NAME") ?: "1.0.0"
    def kailaKeystorePath = findProperty("KAILA_RELEASE_STORE_FILE") ?: System.getenv("KAILA_RELEASE_STORE_FILE")
    def kailaKeystorePassword = findProperty("KAILA_RELEASE_STORE_PASSWORD") ?: System.getenv("KAILA_RELEASE_STORE_PASSWORD")
    def kailaKeyAlias = findProperty("KAILA_RELEASE_KEY_ALIAS") ?: System.getenv("KAILA_RELEASE_KEY_ALIAS")
    def kailaKeyPassword = findProperty("KAILA_RELEASE_KEY_PASSWORD") ?: System.getenv("KAILA_RELEASE_KEY_PASSWORD")

    signingConfigs {
        release {
            if (kailaKeystorePath && kailaKeystorePassword && kailaKeyAlias && kailaKeyPassword) {
                storeFile file(kailaKeystorePath)
                storePassword kailaKeystorePassword
                keyAlias kailaKeyAlias
                keyPassword kailaKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.kaila.marketplace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode kailaVersionCode
        versionName kailaVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (kailaKeystorePath && kailaKeystorePassword && kailaKeyAlias && kailaKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "kaila-mobile-v${variant.versionName}-${variant.versionCode}-${variant.name}.apk"
        }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        def variantName = variant.name
        def capitalizedVariantName = variantName.capitalize()
        def apkOutputDir = layout.buildDirectory.dir("outputs/apk/${variantName}")
        def apkAliasDir = layout.buildDirectory.dir("outputs/apk/kaila/${variantName}")
        def copyTaskName = "copy${capitalizedVariantName}Apk"

        tasks.register(copyTaskName, Copy) {
            from(apkOutputDir) {
                include "*.apk"
                exclude "kaila-mobile.apk"
                rename { "kaila-mobile.apk" }
            }
            into apkAliasDir
        }

        tasks.named("assemble${capitalizedVariantName}") {
            finalizedBy copyTaskName
        }

        def bundleTaskName = "bundle${capitalizedVariantName}"
        if (tasks.findByName(bundleTaskName) != null) {
            def bundleOutputDir = layout.buildDirectory.dir("outputs/bundle/${variantName}")
            def bundleAliasDir = layout.buildDirectory.dir("outputs/bundle/kaila/${variantName}")
            def copyBundleTaskName = "copy${capitalizedVariantName}Bundle"

            tasks.register(copyBundleTaskName, Copy) {
                from(bundleOutputDir) {
                    include "*.aab"
                    rename { "kaila-mobile-v${variant.versionName}-${variant.versionCode}-${variant.name}.aab" }
                }
                into bundleAliasDir
            }

            tasks.named(bundleTaskName) {
                finalizedBy copyBundleTaskName
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    def firebaseMessagingVersion = rootProject.ext.has('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
